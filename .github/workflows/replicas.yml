name: Actualizar réplicas sísmicas

on:
  schedule:
    - cron: '0 11 * * *'      # 06:00 hora Colombia, todos los días
  workflow_dispatch:           # botón manual en la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Consultar USGS
        run: node scripts/replicas.js

      - name: Publicar si hubo cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add replicas.json
          git diff --staged --quiet && echo "Sin cambios" && exit 0
          git commit -m "Actualizar réplicas sísmicas (USGS)"
          git push
