<style>
:root{
  --ink:#14181C;
  --ink-2:#2C333A;
  --paper:#F1F3F2;
  --paper-2:#FFFFFF;
  --senal:#FFD100;
  --verificado:#0B6E5F;
  --alerta:#B3261E;
  --concreto:#8A9199;
  --linea:#D5D9D7;
  --display:'Barlow Condensed',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.5;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
.wrap{max-width:620px;margin:0 auto}

/* ---------- CABECERA / SISMOGRAMA ---------- */
.hero{background:var(--ink);color:var(--paper);position:relative;overflow:hidden}
.hero-top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 0}
.brand{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.09em;text-transform:uppercase}
.brand span{color:var(--senal)}
.lang{display:flex;border:1px solid #3A4249;border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--concreto);font-family:var(--mono);font-size:11px;
  font-weight:600;padding:5px 11px;cursor:pointer;letter-spacing:.05em}
.lang button[aria-pressed="true"]{background:var(--senal);color:var(--ink)}

.seismo{display:block;width:100%;height:118px;margin-top:2px}
.seismo .grid{stroke:#242C33;stroke-width:1}
.seismo .trace{fill:none;stroke:var(--senal);stroke-width:2;stroke-linejoin:round;
  stroke-dasharray:4000;stroke-dashoffset:4000;animation:draw 2.6s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.seismo .trace{animation:none;stroke-dashoffset:0}}

.readout{padding:0 18px 18px;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.mag{font-family:var(--display);font-size:52px;font-weight:700;line-height:.85;color:var(--senal)}
.mag small{display:block;font-family:var(--mono);font-size:10px;font-weight:600;
  color:var(--concreto);letter-spacing:.16em;margin-bottom:4px}
.epi{font-family:var(--mono);font-size:11.5px;line-height:1.7;color:#B9C0C6;flex:1;min-width:180px}
.epi b{color:var(--paper);font-weight:600}

.reloj{background:var(--ink-2);color:#B9C0C6;font-family:var(--mono);font-size:11px;
  padding:8px 18px;display:flex;justify-content:space-between;gap:10px;border-top:1px solid #3A4249}
.reloj b{color:var(--senal);font-weight:600}

/* ---------- CIFRAS ---------- */
.cifras{display:grid;grid-template-columns:repeat(3,1fr);background:var(--ink);
  border-top:1px solid #242C33}
.cifra{padding:13px 10px 15px;text-align:center;border-right:1px solid #242C33}
.cifra:last-child{border-right:0}
.cifra .n{font-family:var(--display);font-size:30px;font-weight:700;color:var(--paper);line-height:1}
.cifra .l{font-family:var(--mono);font-size:9px;letter-spacing:.13em;color:var(--concreto);
  text-transform:uppercase;margin-top:5px}
.fuente-cifras{background:var(--ink);color:var(--concreto);font-family:var(--mono);
  font-size:9.5px;padding:0 18px 12px;text-align:center;letter-spacing:.03em}

/* ---------- SECCIONES ---------- */
.panel{display:none;padding:0 0 30px}
.panel.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel.on{animation:none}}

.sec-h{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-2);padding:22px 18px 9px;
  display:flex;align-items:center;gap:9px}
.sec-h::after{content:"";flex:1;height:5px;
  background:repeating-linear-gradient(90deg,var(--linea) 0 1px,transparent 1px 7px)}
.nota{font-size:13.5px;color:#525C64;padding:0 18px 12px;line-height:1.55}

.card{background:var(--paper-2);border:1px solid var(--linea);border-radius:10px;
  margin:0 14px 11px;overflow:hidden}
.card-h{padding:13px 15px 11px;display:flex;gap:11px;align-items:flex-start}
.card-h h3{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.12;
  letter-spacing:.01em;flex:1}
.card-h p{font-size:13px;color:#5A646C;margin-top:3px;line-height:1.45}
.tag{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;padding:4px 8px;border-radius:4px;white-space:nowrap;margin-top:2px}
.tag.ok{background:#E1F0EC;color:var(--verificado)}
.tag.warn{background:#FDE9E7;color:var(--alerta)}
.tag.info{background:#FFF3C4;color:#6B5300}

.dato{display:flex;align-items:center;gap:10px;padding:10px 15px;border-top:1px solid #EBEEEC}
.dato .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;color:var(--concreto);
  text-transform:uppercase;width:74px;flex-shrink:0;line-height:1.3}
.dato .v{font-family:var(--mono);font-size:14px;font-weight:600;flex:1;word-break:break-all;
  letter-spacing:.01em}
.copiar{background:var(--ink);color:var(--paper);border:0;border-radius:6px;
  font-family:var(--mono);font-size:10px;font-weight:600;padding:7px 11px;cursor:pointer;
  letter-spacing:.06em;flex-shrink:0;transition:background .15s}
.copiar:active{background:var(--verificado)}
.copiar.done{background:var(--verificado)}

.acciones{display:flex;gap:8px;padding:11px 15px;border-top:1px solid #EBEEEC;flex-wrap:wrap}
.btn{flex:1;min-width:118px;text-align:center;text-decoration:none;border:1px solid var(--ink);
  border-radius:7px;padding:11px 10px;font-family:var(--display);font-size:14px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink);background:transparent;
  cursor:pointer;transition:background .15s,color .15s}
.btn:hover,.btn:focus-visible{background:var(--ink);color:var(--paper)}
.btn.fill{background:var(--senal);border-color:var(--senal)}
.btn.fill:hover,.btn.fill:focus-visible{background:var(--ink);border-color:var(--ink);color:var(--senal)}

/* ---------- LISTAS SI / NO ---------- */
.si-no{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:0 14px}
.col{background:var(--paper-2);border:1px solid var(--linea);border-radius:10px;padding:13px 14px}
.col h4{font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;margin-bottom:9px;padding-bottom:8px;border-bottom:2px solid}
.col.si h4{color:var(--verificado);border-color:var(--verificado)}
.col.no h4{color:var(--alerta);border-color:var(--alerta)}
.col li{list-style:none;font-size:13.5px;line-height:1.4;padding:5px 0 5px 15px;position:relative}
.col li::before{position:absolute;left:0;font-family:var(--mono);font-weight:600;font-size:12px}
.col.si li::before{content:"+";color:var(--verificado)}
.col.no li::before{content:"\00d7";color:var(--alerta)}
@media (max-width:430px){.si-no{grid-template-columns:1fr}}

/* ---------- FRAUDE ---------- */
.fraude{background:#FDE9E7;border:1px solid #F2C4BF;border-left:5px solid var(--alerta);
  border-radius:10px;margin:0 14px 11px;padding:13px 15px}
.fraude h4{font-family:var(--display);font-size:17px;font-weight:700;color:var(--alerta);
  letter-spacing:.03em;margin-bottom:5px}
.fraude p{font-size:13.5px;line-height:1.5;color:#5C2420}
.regla{background:var(--senal);border-radius:10px;margin:0 14px 14px;padding:14px 16px}
.regla h4{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;margin-bottom:7px}
.regla li{list-style:none;font-size:13.5px;line-height:1.45;padding:4px 0 4px 20px;position:relative;font-weight:500}
.regla li::before{content:"\2713";position:absolute;left:0;font-weight:700}

/* ---------- PUNTOS ---------- */
.geo-bar{display:flex;gap:8px;padding:0 14px 12px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.05em;
  border:1px solid var(--linea);background:var(--paper-2);border-radius:999px;padding:8px 13px;
  cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--senal);border-color:var(--ink)}
.punto{background:var(--paper-2);border:1px solid var(--linea);border-radius:10px;
  margin:0 14px 9px;padding:12px 15px}
.punto .ciudad{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--concreto);display:flex;justify-content:space-between;gap:8px}
.punto .dist{color:var(--verificado);font-weight:600}
.punto h3{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.15;margin:4px 0 3px}
.punto .dir{font-size:13px;color:#5A646C;line-height:1.45}
.punto .que{font-size:12.5px;color:var(--ink-2);margin-top:7px;padding-top:7px;
  border-top:1px dashed var(--linea)}
.punto .ir{display:inline-block;margin-top:9px;font-family:var(--display);font-size:13px;
  font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink);
  text-decoration:none;border-bottom:2px solid var(--senal);padding-bottom:1px}

/* ---------- NAV ---------- */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--ink);z-index:50;
  padding-bottom:env(safe-area-inset-bottom);border-top:2px solid var(--senal)}
.nav-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{background:none;border:0;color:var(--concreto);cursor:pointer;
  height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--senal)}

/* ---------- PIE ---------- */
footer{background:var(--ink);color:var(--concreto);padding:24px 18px 30px;text-align:center;
  font-size:11.5px;line-height:1.7}
footer a{color:#B9C0C6}
.habeas{font-family:var(--mono);font-size:10px;line-height:1.75;color:#78818A;
  border-top:1px solid #2C333A;margin-top:14px;padding-top:14px;text-align:left}
.credito{font-family:var(--mono);font-size:9.5px;color:#5F6870;margin-top:14px;letter-spacing:.05em}

.toast{position:fixed;bottom:calc(var(--nav-h) + 18px);left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--verificado);color:#fff;font-family:var(--mono);font-size:12px;font-weight:600;
  padding:11px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:all .22s;z-index:80;
  max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.offline{background:var(--alerta);color:#fff;font-family:var(--mono);font-size:11px;
  text-align:center;padding:7px;display:none}
.offline.on{display:block}
.frescura{display:none;font-family:var(--mono);font-size:11.5px;line-height:1.5;
  padding:9px 16px;text-align:center;font-weight:600;letter-spacing:.02em}
.frescura.on{display:block}
.frescura.amarillo{background:var(--senal);color:var(--ink)}
.frescura.rojo{background:var(--alerta);color:#fff}
.replica{display:flex;align-items:center;gap:12px;background:var(--paper-2);
  border:1px solid var(--linea);border-radius:10px;margin:0 14px 8px;padding:11px 14px}
.replica .m{font-family:var(--display);font-size:26px;font-weight:700;line-height:1;
  width:56px;flex-shrink:0;text-align:center}
.replica .m.baja{color:var(--concreto)}
.replica .m.media{color:#B07800}
.replica .m.alta{color:var(--alerta)}
.replica .d{flex:1;min-width:0}
.replica .d b{font-family:var(--body);font-size:13.5px;font-weight:600;display:block;line-height:1.3}
.replica .d span{font-family:var(--mono);font-size:10.5px;color:var(--concreto);letter-spacing:.03em}
.vacio{font-size:13px;color:#6B747B;padding:0 18px 8px;font-style:italic}
:focus-visible{outline:3px solid var(--senal);outline-offset:2px}
</style>
</head>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1900); }

function copiar(v, btn){
  const done = () => { toast(T[L].copiado + ' · ' + v); btn.classList.add('done');
    btn.textContent = T[L].copiado; setTimeout(()=>{btn.classList.remove('done');btn.textContent=T[L].copiar;},1800); };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(v).then(done).catch(fallback); }
  else fallback();
  function fallback(){ const ta=document.createElement('textarea'); ta.value=v; ta.style.position='fixed';
    ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy');done();}catch(e){toast(v);} document.body.removeChild(ta); }
}

/* ---------- sismograma (firma visual) ---------- */
function dibujarSismo(){
  const W=600,H=118,mid=H/2, svg=$('seismo');
  let g='';
  for(let x=0;x<=W;x+=30) g+=`<line class="grid" x1="${x}" y1="0" x2="${x}" y2="${H}"/>`;
  for(let y=0;y<=H;y+=29) g+=`<line class="grid" x1="0" y1="${y}" x2="${W}" y2="${y}"/>`;
  let pts='';
  for(let x=0;x<=W;x+=2){
    const t=x/W; let a;
    if(t<0.24){ a=Math.sin(t*90)*4*(t/0.24); }                       // ondas P
    else if(t<0.34){ a=Math.sin(t*130)*38*Math.sin((t-0.24)/0.10*Math.PI); } // onda S / pico
    else { a=Math.sin(t*105)*34*Math.exp(-(t-0.34)*6.2)+Math.sin(t*47)*5*Math.exp(-(t-0.34)*3.4); } // coda
    pts += `${x},${(mid - a).toFixed(1)} `;
  }
  svg.innerHTML = g + `<polyline class="trace" points="${pts.trim()}"/>`;
}


/* ---------- semáforo de frescura ----------
   La app confiesa su propia edad. Si nadie actualiza datos.json,
   avisa al usuario en vez de fingir que la información sigue vigente. */
function renderFrescura(){
  const el = $('frescura'), t = T[L];
  const horas = (Date.now() - new Date(D.actualizado).getTime()) / 36e5;
  el.className = 'frescura';
  if(!isFinite(horas) || horas < 24) return;
  const dias = Math.floor(horas/24);
  const lapso = horas < 48 ? t.horas.replace('{n}', Math.floor(horas))
              : dias === 1 ? t.unDia : t.dias.replace('{n}', dias);
  const rojo = horas >= 72;
  el.textContent = (rojo ? t.frRojo : t.frAmarillo).replace('{t}', lapso);
  el.classList.add('on', rojo ? 'rojo' : 'amarillo');
}

let REPLICAS = null;
function bloqueReplicas(){
  const t = T[L];
  let h = `<div class="sec-h">${t.hReplicas}</div><p class="nota">${t.hReplicasN}</p>`;
  if(!REPLICAS || !REPLICAS.sismos || !REPLICAS.sismos.length)
    return h + `<p class="vacio">${t.sinReplicas}</p>`;
  REPLICAS.sismos.slice(0,12).forEach(r=>{
    const m = parseFloat(r.mag);
    const cls = m >= 5 ? 'alta' : m >= 4 ? 'media' : 'baja';
    const hrs = (Date.now() - new Date(r.fecha).getTime())/36e5;
    const rel = hrs < 1 ? (L==='es'?'hace minutos':'minutes ago')
              : hrs < 48 ? `${t.hace} ${Math.floor(hrs)} h${L==='en'?' ago':''}`.trim()
              : `${t.hace} ${Math.floor(hrs/24)} d${L==='en'?' ago':''}`.trim();
    h += `<div class="replica">
      <div class="m ${cls}">${m.toFixed(1).replace('.', L==='es'?',':'.')}</div>
      <div class="d"><b>${esc(r.lugar)}</b>
      <span>${esc(rel)} · ${t.prof} ${Math.round(r.prof)} km</span></div>
    </div>`;
  });
  return h;
}

function dist(a,b,c,d){
  const R=6371, r=x=>x*Math.PI/180;
  const dLat=r(c-a), dLon=r(d-b);
  const x=Math.sin(dLat/2)**2 + Math.cos(r(a))*Math.cos(r(c))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

  });
  h += `<div class="sec-h">${t.hReglas}</div>
    <div class="regla"><h4>${t.hReglas}</h4><ul>${tx(D.reglas).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  $('p-seguridad').innerHTML = h;
}

function renderInfo(){
  const t=T[L];
  let h = bloqueReplicas() + `<div class="sec-h">${t.hApp}</div><p class="nota">${t.appTexto}</p>
    <div class="sec-h">${t.hInstalar}</div><p class="nota">${t.instrIos}</p>
    <div class="card"><div class="acciones" style="border-top:0">
      <button class="btn fill" id="btInstall">${t.instalar}</button>
      <button class="btn" id="btShare">${t.compartir}</button>
    </div></div>
    <div class="sec-h">${t.hOficiales}</div><p class="nota">${t.hOficialesN}</p>`;
  D.oficiales.forEach(o=>{
    h += `<div class="punto"><h3>${esc(o.n)}</h3><div class="dir">${esc(tx(o.d))}</div>
      <a class="ir" href="${o.u}" target="_blank" rel="noopener">${t.web} →</a></div>`;
  });
  $('p-info').innerHTML = h;
}

const ICONS = [
  '<path d="M12 21s-7-4.5-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.5-9 9-9 9z"/>',
  '<path d="M12 21s7-6 7-11a7 7 0 1 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  '<circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>',
  '<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M12 9v4"/><path d="M12 16h.01"/>',
  '<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/>'
];

function renderNav(){
  $('nav').innerHTML = T[L].nav.map((n,i)=>
    `<button role="tab" data-i="${i}" aria-selected="${i===tabActual}">
      <svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[i]}</svg>${esc(n)}
    </button>`).join('');
}

let tabActual = 0;
const PANELS = ['p-ayudar','p-puntos','p-personas','p-seguridad','p-info'];
function irTab(i){
  tabActual = i;
  PANELS.forEach((p,k)=>$(p).classList.toggle('on', k===i));
  document.querySelectorAll('#nav button').forEach((b,k)=>b.setAttribute('aria-selected', k===i));
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderTodo(){
  const t=T[L], e=D.evento;
  document.documentElement.lang = L;
  $('lHora').textContent = t.hora;
  $('lMag').textContent = t.mag;
  $('epi').innerHTML = t.epi.replace('{epi}',esc(e.epicentro)).replace('{fecha}',esc(e.fecha))
                            .replace('{hora}',esc(e.hora)).replace('{prof}',esc(e.profundidad));
  document.querySelector('.mag').childNodes[1].nodeValue = e.magnitud;
  $('cifras').innerHTML = D.cifras.map(c=>`<div class="cifra"><div class="n">${esc(c.n)}</div><div class="l">${esc(c[L])}</div></div>`).join('');
  $('fuenteCifras').textContent = tx(D.fuenteCifras) + ' · ' + T[L].act + ' ' + fmtFecha(D.actualizado);
  $('reloj').textContent = fmtReloj();
  $('pieTexto').textContent = t.pie;
  $('habeas').textContent = t.habeas;
  $('offBar').textContent = t.offline;
  renderFrescura();
  renderNav(); renderAyudar(); renderPuntos(); renderPersonas(); renderSeguridad(); renderInfo();
}

function setLang(l){
  L=l;
  $('btEs').setAttribute('aria-pressed', l==='es');
  $('btEn').setAttribute('aria-pressed', l==='en');
  renderTodo();
}

/* ---------- eventos delegados ---------- */
document.addEventListener('click', ev => {
  const nav = ev.target.closest('#nav button');
  if(nav){ irTab(+nav.dataset.i); return; }

  const cp = ev.target.closest('[data-copy]');
  if(cp){ copiar(cp.dataset.copy, cp); return; }

  const geo = ev.target.closest('#chipGeo');
  if(geo){
    if(pos){ pos=null; renderPuntos(); return; }
    if(!navigator.geolocation){ toast('GPS no disponible'); return; }
    navigator.geolocation.getCurrentPosition(
      p=>{ pos={lat:p.coords.latitude,lng:p.coords.longitude}; renderPuntos(); },
      ()=> toast(L==='es'?'No se pudo obtener la ubicación':'Could not get your location'),
      {timeout:9000, maximumAge:120000}
    );
    return;
  }

  const ci = ev.target.closest('[data-ciudad]');
  if(ci){ ciudadSel = ci.dataset.ciudad || null; renderPuntos(); return; }

  if(ev.target.closest('#btInstall')){
    if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt=null; }
    else toast(T[L].instrIos);
    return;
  }
  if(ev.target.closest('#btShare')){
    const d={title:'Colombia Responde', text:T[L].pie, url:location.href};
    if(navigator.share) navigator.share(d).catch(()=>{});
    else copiar(location.href, ev.target.closest('#btShare'));
  }
});

window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt=e; });
const estadoRed = () => $('offBar').classList.toggle('on', !navigator.onLine);
window.addEventListener('online', estadoRed);
window.addEventListener('offline', estadoRed);

/* ---------- arranque ---------- */
dibujarSismo();
renderTodo();
estadoRed();

fetch('datos.json', {cache:'no-cache'})
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(j => { D = j; renderTodo(); })
  .catch(()=>{ /* corre con SEED embebido */ });

fetch('replicas.json', {cache:'no-cache'})
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(j => { REPLICAS = j; renderInfo(); })
  .catch(()=>{ /* la sección muestra el mensaje de "sin datos" */ });

setInterval(renderFrescura, 18e5);

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
